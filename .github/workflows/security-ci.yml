name: Security CI & Vulnerability Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    name: Dependency & Secret Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: SCA Dependency Audit (audit-ci)
        run: npx audit-ci --moderate

      - name: SAST Code Security Scan (eslint-plugin-security)
        run: npx eslint . --max-warnings=0

      - name: Red-Team & OWASP Vulnerability Verification
        run: node scripts/run_vulnerability_audit.js

      - name: Deep Secret Integrity Scan
        run: node scripts/audit_deep_scan.js

      - name: Unit & Logic Test Suite
        run: node scripts/run_all_tests.js

      - name: Production Build Verification
        run: npm run build

  snyk-scan:
    name: Snyk Vulnerability Monitor
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Check Snyk Token
        id: snyk_check
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SNYK_TOKEN not configured; skipping Snyk cloud scan."
          fi

      - name: Install Dependencies
        if: steps.snyk_check.outputs.enabled == 'true'
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        if: steps.snyk_check.outputs.enabled == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npx snyk test --severity-threshold=high
        continue-on-error: true
