name: Security CI & Vulnerability Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    name: Dependency & Secret Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: SCA Dependency Audit (audit-ci)
        run: npx audit-ci --moderate

      - name: SAST Code Security Scan (eslint-plugin-security)
        run: npx eslint . --max-warnings=50

      - name: Red-Team & OWASP Vulnerability Verification
        run: node scripts/run_vulnerability_audit.js

      - name: Deep Secret Integrity Scan
        run: node scripts/audit_deep_scan.js

      - name: Unit & Logic Test Suite
        run: node scripts/run_all_tests.js

  snyk-scan:
    name: Snyk Vulnerability Monitor
    runs-on: ubuntu-latest
    needs: security-audit
    if: env.SNYK_TOKEN != ''
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high
        continue-on-error: true
